<!doctype html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#205c49"><meta name="apple-mobile-web-app-title" content="Palabra"><meta name="referrer" content="no-referrer"><title>Palabra</title><link rel="icon" href="./favicon.svg"><link rel="stylesheet" href="./style.css"><script type="module" src="./app.js"></script></head>
<body>
<header><a class="brand" href="./" aria-label="Palabra ホーム"><span class="brand-icon">p.</span>palabra</a></header>
<main>
<section class="search-area" aria-label="単語検索">
<form id="search-form"><label class="sr-only" for="word">スペイン語の単語</label><span class="search-icon" aria-hidden="true">⌕</span><input id="word" name="word" placeholder="スペイン語を入力" value="he" maxlength="80" autocomplete="off" autocapitalize="none" enterkeyhint="search" spellcheck="false" lang="es" required><button type="button" id="clear-word" class="clear-word" aria-label="入力を消去" title="入力を消去">×</button><button type="button" id="mic" class="mic" aria-label="スペイン語を音声入力" title="スペイン語を音声入力"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11v1a6 6 0 0 0 12 0v-1M12 18v3m-4 0h8"/></svg></button><button type="submit" class="search-button">調べる <span>→</span></button></form>
<p id="status" class="status" role="status" aria-live="polite"></p><div id="tokens" class="tokens" hidden></div>
</section>
<div class="workspace"><section id="results" aria-label="検索結果" aria-live="polite"></section><aside>
<section class="notebook"><div class="aside-heading"><span class="small-icon">▤</span><h2>単語帳</h2><span id="saved-count">0</span></div><div id="saved-list"></div></section>
<section class="speech-settings"><h2>発音の設定</h2><label for="dialect">地域<select id="dialect"><option value="es-PE" selected>ペルー</option><option value="es-CO">コロンビア</option><option value="es-CL">チリ</option><option value="es-AR">アルゼンチン</option><option value="es-MX">メキシコ</option><option value="es-ES">スペイン</option></select></label><label for="speed">速さ<select id="speed"><option value="0.8">ゆっくり</option><option value="1" selected>ふつう</option><option value="1.15">少し速く</option></select></label><p id="voice-note"></p></section>
</aside></div>
</main>
</body></html>
